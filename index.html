<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de la compra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --paper: #f4f5f0;
    --paper-raised: #ffffff;
    --ink: #1b211c;
    --muted: #6e756b;
    --line: #d8dad1;
    --accent: #2f6b4f;
    --accent-ink: #ffffff;
    --warm: #c85a34;
    --shadow: rgba(27, 33, 28, 0.10);
    --focus: #2f6b4f;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #13160f;
      --paper-raised: #1b2018;
      --ink: #edefe7;
      --muted: #9ba294;
      --line: #2a2f26;
      --accent: #5cae83;
      --accent-ink: #0b140e;
      --warm: #e6835a;
      --shadow: rgba(0, 0, 0, 0.45);
      --focus: #5cae83;
    }
  }

  :root[data-theme="dark"] {
    --paper: #13160f;
    --paper-raised: #1b2018;
    --ink: #edefe7;
    --muted: #9ba294;
    --line: #2a2f26;
    --accent: #5cae83;
    --accent-ink: #0b140e;
    --warm: #e6835a;
    --shadow: rgba(0, 0, 0, 0.45);
    --focus: #5cae83;
  }

  * { box-sizing: border-box; }

  html { background: var(--paper); }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
    padding: 40px 16px 80px;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
  }

  .page {
    max-width: 460px;
    margin: 0 auto;
  }

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
    gap: 12px;
  }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .linklike {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  h1 {
    font-size: 22px;
    line-height: 1.25;
    margin: 0 0 10px;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }

  .lede {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    margin: 0 0 26px;
  }

  .lede strong { color: var(--ink); font-weight: 600; }

  .ticket {
    position: relative;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px 22px 30px;
    box-shadow: 0 1px 2px var(--shadow), 0 8px 20px -12px var(--shadow);
    margin-bottom: 20px;
  }

  .ticket::after {
    content: "";
    position: absolute;
    left: 1px;
    right: 1px;
    bottom: -9px;
    height: 16px;
    background:
      linear-gradient(-45deg, var(--paper) 8px, transparent 0),
      linear-gradient(45deg, var(--paper) 8px, transparent 0);
    background-size: 16px 16px;
    background-position: left bottom;
    background-repeat: repeat-x;
  }

  .ticket-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .ticket-title {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .tear-divider {
    border-top: 1px dashed var(--line);
    margin: 18px 0;
  }

  .menu-row {
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 2px 10px;
    padding: 6px 0;
    font-size: 13.5px;
  }

  .menu-day {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
    padding-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .menu-slots { display: flex; flex-direction: column; gap: 3px; }
  .menu-slot { display: flex; gap: 6px; }
  .menu-slot .tag {
    font-size: 10.5px;
    color: var(--muted);
    width: 44px;
    flex: none;
    padding-top: 1px;
  }

  .cat-block { margin-bottom: 16px; }
  .cat-block:last-child { margin-bottom: 0; }

  .cat-label {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    font-weight: 600;
  }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .progress {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
  }

  .item-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 2px;
    cursor: pointer;
    min-height: 44px;
  }

  .item-row input {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  .check-box {
    width: 20px;
    height: 20px;
    flex: none;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    position: relative;
    background: var(--paper-raised);
  }

  .item-row input:checked ~ .check-box {
    background: var(--accent);
    border-color: var(--accent);
  }

  .check-box::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 2px;
    width: 5px;
    height: 10px;
    border: solid var(--accent-ink);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
    opacity: 0;
  }

  .item-row input:checked ~ .check-box::after { opacity: 1; }

  .item-row input:focus-visible ~ .check-box {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .item-text { flex: 1; min-width: 0; }
  .item-name { font-size: 14.5px; }
  .item-who { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

  .item-row input:checked ~ .item-text .item-name {
    text-decoration: line-through;
    color: var(--muted);
  }

  .viewer-menu {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .state-box {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px;
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.6;
  }

  .state-box.error { border-color: var(--warm); color: var(--warm); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <span class="eyebrow">Lista de la compra</span>
    <button id="btn-refresh" class="linklike" type="button">Actualizar</button>
  </div>

  <div id="state-loading" class="state-box">Cargando la lista…</div>

  <div id="state-empty" class="state-box" hidden>
    Todavía no se ha generado ninguna lista desde el escritorio. En cuanto pulses
    «Generar lista de la compra» en la app, aparecerá aquí sola.
  </div>

  <div id="state-error" class="state-box error" hidden></div>

  <div id="state-content" hidden>
    <p class="lede" id="lede"></p>
    <div class="ticket" id="ticket"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  function totalItemCount(list) {
    var n = 0;
    list.forEach(function (b) { n += b.items.length; });
    return n;
  }

  function renderMenu(container, menu) {
    var days = [];
    menu.forEach(function (m) {
      var d = days.find(function (x) { return x.day === m.day; });
      if (!d) { d = { day: m.day, slots: [] }; days.push(d); }
      d.slots.push(m);
    });
    var wrap = document.createElement("div");
    wrap.className = "viewer-menu";
    days.forEach(function (d) {
      var row = document.createElement("div");
      row.className = "menu-row";
      var dayEl = document.createElement("div");
      dayEl.className = "menu-day mono";
      dayEl.textContent = d.day.slice(0, 3);
      var slotsEl = document.createElement("div");
      slotsEl.className = "menu-slots";
      d.slots.forEach(function (s) {
        var slotEl = document.createElement("div");
        slotEl.className = "menu-slot";
        slotEl.innerHTML = '<span class="tag">' + (s.slot === "comida" ? "comida" : "cena") + '</span><span>' + s.recipe + '</span>';
        slotsEl.appendChild(slotEl);
      });
      row.appendChild(dayEl);
      row.appendChild(slotsEl);
      wrap.appendChild(row);
    });
    container.appendChild(wrap);
  }

  function renderList(container, list, storageKey) {
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch (e) { saved = {}; }

    var progress = document.createElement("div");
    var total = totalItemCount(list);
    container.appendChild(progress);

    function updateProgress() {
      var checked = Object.keys(saved).filter(function (k) { return saved[k]; }).length;
      progress.className = "progress";
      progress.textContent = checked + " / " + total + " marcados";
    }

    list.forEach(function (block) {
      var catEl = document.createElement("div");
      catEl.className = "cat-block";
      var label = document.createElement("div");
      label.className = "cat-label";
      label.textContent = block.cat_label;
      catEl.appendChild(label);

      block.items.forEach(function (item) {
        var id = block.cat + ":" + item.name;
        var row = document.createElement("label");
        row.className = "item-row";

        var input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!saved[id];
        input.addEventListener("change", function () {
          saved[id] = input.checked;
          try { localStorage.setItem(storageKey, JSON.stringify(saved)); } catch (e) {}
          updateProgress();
        });

        var box = document.createElement("span");
        box.className = "check-box";
        box.setAttribute("aria-hidden", "true");

        var text = document.createElement("span");
        text.className = "item-text";
        text.innerHTML = '<div class="item-name">' + item.name + '</div><div class="item-who">' + item.recipes.join(", ") + '</div>';

        row.appendChild(input);
        row.appendChild(box);
        row.appendChild(text);
        catEl.appendChild(row);
      });

      container.appendChild(catEl);
    });

    updateProgress();
  }

  function formatFecha(iso) {
    try {
      var d = new Date(iso);
      var texto = d.toLocaleString("es-ES", {
        weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit"
      });
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    } catch (e) {
      return iso;
    }
  }

  function showState(id) {
    ["state-loading", "state-empty", "state-error", "state-content"].forEach(function (s) {
      document.getElementById(s).hidden = s !== id;
    });
  }

  function showContent(payload) {
    document.getElementById("lede").innerHTML =
      "Generada el <strong>" + formatFecha(payload.generated_at) + "</strong>. Se actualiza sola cada vez " +
      "que generes la lista desde el escritorio.";

    var ticket = document.getElementById("ticket");
    ticket.innerHTML = "";

    if (payload.menu && payload.menu.length) {
      var menuHead = document.createElement("div");
      menuHead.className = "ticket-head";
      menuHead.innerHTML = '<span class="ticket-title mono">Menú semanal</span>';
      ticket.appendChild(menuHead);
      renderMenu(ticket, payload.menu);
      var divider = document.createElement("div");
      divider.className = "tear-divider";
      ticket.appendChild(divider);
    }

    var listHead = document.createElement("div");
    listHead.className = "ticket-head";
    listHead.innerHTML = '<span class="ticket-title mono">Lista de la compra</span>';
    ticket.appendChild(listHead);
    renderList(ticket, payload.list, "compra_" + (payload.generated_at || "sin-fecha"));

    showState("state-content");
  }

  function load() {
    showState("state-loading");
    fetch("./lista.json", { cache: "no-store" })
      .then(function (res) {
        if (res.status === 404) return null;
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (payload) {
        if (!payload || ((!payload.menu || !payload.menu.length) && (!payload.list || !payload.list.length))) {
          showState("state-empty");
          return;
        }
        showContent(payload);
      })
      .catch(function () {
        document.getElementById("state-error").textContent =
          "No se pudo cargar la lista. Comprueba tu conexión e inténtalo de nuevo.";
        showState("state-error");
      });
  }

  document.getElementById("btn-refresh").addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
