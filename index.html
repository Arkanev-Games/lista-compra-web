<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de la compra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="appbar">
    <span class="brand">Menú de la semana</span>
    <button id="btn-refresh" class="refresh-btn" type="button">Actualizar</button>
  </div>

  <!-- Selector de vista: solo dos pestañas, ver .seg-highlight en style.css -->
  <div class="segmented" role="tablist">
    <button class="seg-btn" data-view="menu" role="tab" aria-selected="false" type="button">Menú</button>
    <button class="seg-btn" data-view="compra" role="tab" aria-selected="true" type="button">Compra</button>
    <div id="seg-highlight" class="seg-highlight" aria-hidden="true"></div>
  </div>

  <!-- Estados mutuamente excluyentes: los gestiona showState() en app.js -->
  <div id="state-loading" class="state-card">Cargando la lista…</div>

  <div id="state-empty" class="state-card" hidden>
    Todavía no se ha generado ninguna lista desde el escritorio. En cuanto pulses
    «Generar lista de la compra» en la app, aparecerá aquí sola.
  </div>

  <div id="state-error" class="state-card error" hidden></div>

  <!-- Contenido real, relleno por JS a partir de lista.json -->
  <div id="content" hidden>
    <p class="lede" id="lede"></p>

    <section id="view-compra">
      <div class="progress-card">
        <div class="progress-row">
          <span id="progress-text" class="mono">0 / 0 marcados</span>
        </div>
        <div class="progress-track"><div id="progress-fill" class="progress-fill" style="width:0%"></div></div>
      </div>
      <div id="accordion"></div>
    </section>

    <section id="view-menu" hidden>
      <div id="menu-list"></div>
    </section>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
